# Apache Virtual Host Configuration for TimeOff Management System
# For Ubuntu with Apache 2.4+
#
# Installation:
# 1. Copy this file to /etc/apache2/sites-available/timeoff.conf
# 2. Enable required Apache modules:
#    sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
# 3. Enable the site:
#    sudo a2ensite timeoff.conf
# 4. Reload Apache:
#    sudo systemctl reload apache2

# Redirect HTTP to HTTPS (optional but recommended)
<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    # Optional: Let's Encrypt SSL certificate verification
    # Uncomment if using Let's Encrypt
    # Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    # <Directory /var/www/html/.well-known/acme-challenge/>
    #     Options None
    #     AllowOverride None
    #     Require all granted
    # </Directory>
</VirtualHost>

# HTTPS Virtual Host
<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin admin@your-domain.com

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/your-domain.crt
    SSLCertificateKeyFile /etc/ssl/private/your-domain.key
    # SSLCertificateChainFile /etc/ssl/certs/your-domain-chain.crt

    # Modern SSL Configuration (Mozilla Intermediate)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # HSTS (optional but recommended)
    Header always set Strict-Transport-Security "max-age=63072000"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/timeoff-error.log
    CustomLog ${APACHE_LOG_DIR}/timeoff-access.log combined

    # Reverse Proxy to Node.js application
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket support (if needed in the future)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:3000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://127.0.0.1:3000/$1 [P,L]

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Static file caching (optional)
    <LocationMatch "^/(?:css|js|img|images|fonts)/.*">
        Header set Cache-Control "public, max-age=31536000"
    </LocationMatch>
</VirtualHost>

# HTTP Only Configuration (NOT RECOMMENDED for production)
# Uncomment if you don't want to use HTTPS
